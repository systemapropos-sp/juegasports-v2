name: Fetch Sports Odds

on:
  # Desactivado (2026-08-04): este workflow y el de fsb-pro escribían al
  # mismo games.json en Supabase, pisándose entre sí — fsb-pro corre cada 2h
  # y ya trae resultados/scores + mercados por período, así que es la única
  # fuente que debe quedar activa. Se deja workflow_dispatch por si hace
  # falta correrlo a mano alguna vez; el `schedule:` automático queda
  # comentado a propósito, no borrado.
  # schedule:
  #   - cron: '0 15 * * *'
  workflow_dispatch:
    # Also allows manual "Run workflow" button in GitHub Actions tab

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch odds & upload to Supabase Storage
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node .github/scripts/fetch-odds.cjs

      - name: Done
        run: echo "Odds updated successfully at $(date -u)"
